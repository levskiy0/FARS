name: Build & Push Images

on:
  push:
    branches: [ main ]
  workflow_dispatch:


env:
  IMAGE_REPO: ${{ secrets.DOCKERHUB_USERNAME }}/fars

concurrency:
  group: build-image-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # The image is only published if the suite is green — see test.yml.
  test:
    uses: ./.github/workflows/test.yml

  build-and-push:
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 30

    permissions:
      contents: read
      packages: write
      id-token: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Log in to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Extract metadata (tags, labels) for Docker
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.IMAGE_REPO }}
          tags: |
            type=raw,value=latest

      - name: Build & push
        uses: docker/build-push-action@v7
        with:
          context: .
          file: Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          sbom: true
          provenance: mode=max
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

  # Docker Hub shows its own page, not the GitHub README: docs/dockerhub.md is
  # written for someone who has the image and not the source tree. The token
  # needs read/write/delete scope to update a description.
  describe:
    needs: build-and-push
    runs-on: ubuntu-latest
    timeout-minutes: 5

    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Update Docker Hub description
        uses: peter-evans/dockerhub-description@v5
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
          repository: ${{ env.IMAGE_REPO }}
          readme-filepath: ./docs/dockerhub.md
          short-description: "On-demand HTTP image resizing: libvips JPEG/PNG/WebP/AVIF variants with a self-invalidating cache"
